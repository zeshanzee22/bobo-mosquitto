
###############################################
# BOBO AI BABY MONITOR - MOSQUITTO
###############################################

listener 1883 0.0.0.0
protocol mqtt

# Authentication
allow_anonymous false
password_file /mosquitto/config/password.txt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Docker logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
